name: Tarkista ja julkaise GitHub Pagesiin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: python -m pip install openpyxl==3.1.5 -r scripts/data/municipal-requirements.txt
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:data
      - run: python -m unittest discover -s scripts/editorial -p "test_*.py"
      - run: node --test scripts/editorial/analysis-model.test.mjs scripts/editorial/population-synthesis-dom.test.mjs
      - run: python -m unittest discover -s scripts/publish -p "test_*.py"
      - name: Export published data and verified images from Turso
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/publish/export_turso.py
      - run: bun run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
