name: Turso atlas themes pilot
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write and verify atlas_themes in Turso"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: turso-atlas-themes-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pilot
        env:
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/migration/turso_pilot.py --apply
          else
            python scripts/migration/turso_pilot.py
          fi
